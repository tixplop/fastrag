[package]
name = "fastrag"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[[bin]]
name = "fastrag"
path = "src/main.rs"

[dependencies]
axum = "0.8.9"
blake3 = "1.8.7"
fs2 = "0.4.3"
pulldown-cmark = "0.13.6"
rmcp = { version = "3.9.0", features = ["server", "macros", "transport-streamable-http-server"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
sqlite-vec = "0.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"
yaml-rust2 = "0.13.2"
notify = "9.0.0"
askama = "0.16.1"

[[test]]
name = "integration"
path = "tests/integration/main.rs"

[dev-dependencies]
rmcp = { version = "3.9.0", features = ["client", "transport-streamable-http-client-reqwest"] }
scraper = "0.29.0"

# Optimisé même en test : sans cela, 10 000 notes sont trop lentes à indexer (REQ-020) ; dépendances à fond, crate à 1.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
