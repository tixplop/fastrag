[package]
name = "fastrag"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[[bin]]
name = "fastrag"
path = "src/main.rs"

[dependencies]
fs2 = "0.4.3"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
sqlite-vec = "0.1"
toml = "0.8"

[[test]]
name = "integration"
path = "tests/integration/main.rs"
